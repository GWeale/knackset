<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="100mm" viewBox="0 0 425.19685039 283.46456693" role="img" aria-labelledby="proof-title proof-description">
<title id="proof-title">Pocket Radio</title>
<desc id="proof-description">Small Hours label proof. 150 by 100 millimetres, landscape. Approved text only; no photograph.</desc>
<rect x="0" y="0" width="425.19685039" height="283.46456693" fill="#f5f0e6"/>
<g fill="#272720" font-family="Arial, Helvetica, sans-serif">
<text x="28.34645669" y="34" font-size="12" font-weight="400">Small Hours</text>
<text x="28.34645669" y="84" font-size="28" font-weight="700">Pocket Radio</text>
<text x="28.34645669" y="108" font-size="13" font-weight="400">Loaned by E. Vale</text>
<text x="28.34645669" y="151" font-size="14" font-weight="400">I kept this by the kitchen window.</text>
<text x="28.34645669" y="172" font-size="14" font-weight="400">The signal was clearest just before the</text>
<text x="28.34645669" y="193" font-size="14" font-weight="400">weather forecast. My brother would call</text>
<text x="28.34645669" y="214" font-size="14" font-weight="400">afterward to ask whether it would rain.</text>
</g>
</svg>

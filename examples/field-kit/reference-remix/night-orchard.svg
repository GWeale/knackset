<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 297 420" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Night Orchard</title>
  <desc id="poster-desc">An original A3 portrait poster for a fictional evening of orchard walks, sound installations and conversations with field scientists. An open, irregular orchard crown sits in a quiet dark field. Small grouped strokes punctuate a walking route. Night Orchard. Saturday 18 May / 18:00-23:00. Alder Field Station. Walks, listening, and small discoveries. Free entry / booking required.</desc>
  <metadata>Original vector artwork. Developed from three supplied textual reference studies; no reference images were available or inspected. A3 portrait, 297 × 420 mm. SVG is editable; no external fonts, images, scripts or linked assets.</metadata>
  <rect width="297" height="420" fill="#102725"/>
  <g fill="#f0efd9" font-family="DejaVu Sans, sans-serif">
    <path d="M18 19H279" fill="none" stroke="#a5b9a1" stroke-width=".35"/>
    <text x="18" y="27" font-size="3.1" font-weight="600" letter-spacing=".65">AN EVENING IN THE FIELD</text>
    <text x="17" y="83" font-size="60" font-weight="500" letter-spacing="-2.4">Night</text>
    <text x="16" y="139" font-size="60" font-weight="500" letter-spacing="-2.4">Orchard</text>
    <text x="19" y="158" font-size="6.2" font-weight="400">
      <tspan x="19" dy="0">Walks, listening, and small discoveries</tspan>
    </text>
  </g>

  <!-- One orchard crown, drawn as an irregular, open observational contour. -->
  <g fill="none" stroke="#bdd7a7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M111 240C101 230 104 217 115 211C114 198 127 192 139 198C147 186 161 190 167 201C183 196 195 207 191 220C205 228 199 244 188 249C191 264 178 273 166 268C158 282 142 276 137 268C123 274 110 264 115 252" stroke-width=".85"/>
    <path d="M118 237C112 227 118 219 127 218C125 207 138 205 144 211C149 201 162 204 163 216C176 209 186 220 181 229C192 239 184 251 174 249C174 260 161 265 154 258C143 268 132 259 134 249C122 251 117 245 118 242" stroke-width=".55" opacity=".68"/>
    <path d="M149 268L149 234M149 248L128 231M149 240L168 220M149 253L174 241M149 230L142 216" stroke-width=".7"/>
    <path d="M127 231L124 222M129 232L120 233M168 221L169 213M166 223L176 223M172 241L181 237M142 217L136 214" stroke-width=".55"/>
  </g>
  <g fill="#d8e9b5">

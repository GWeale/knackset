<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="card-title card-desc">
  <title id="card-title">Knackset — Creative field kit preview</title>
  <desc id="card-desc">Follow a question. Make something worth keeping. Rabbit Hole · Reference Remix · Unstick Project. github.com/GWeale/knackset. An open ring of fine strokes is gathered onto an angular lime sheet with an orange folded corner.</desc>
  <metadata>Original editable launch artwork. Reference mechanisms: Night Orchard's deliberate scale and quiet space; Held Between's repeated marks and meaningful interruptions; Knackset's existing folded-page geometry and palette. No external assets, scripts or fonts are linked. All visible type remains editable SVG text. Canvas 1200 by 630 pixels.</metadata>
  <rect id="paper" width="1200" height="630" fill="#f4efe5"/>


<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="148mm" height="210mm" viewBox="0 0 148 210" role="img" aria-labelledby="sheet-title sheet-desc">
  <title id="sheet-title">Field Notes — Look once. Look again.</title>
  <desc id="sheet-desc">An A5 slow-looking worksheet. Three original abstract motifs introduce a boundary, a repeating wave, and a branching line. Each prompt has two long rules for written observations.</desc>
  <defs>
    <clipPath id="art-window"><rect x="13" y="56" width="122" height="28"/></clipPath>
  </defs>

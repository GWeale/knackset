<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="148mm" height="210mm" viewBox="0 0 148 210" role="img" aria-labelledby="sheet-title sheet-desc">
  <title id="sheet-title">Field Notes — Look once. Look again.</title>
  <desc id="sheet-desc">A5 portrait slow-looking worksheet. Original nested contours lead into three prompts, each with three ruled writing lines. Color edition in deep teal, terracotta and citron.</desc>
  <g id="identity">
    <text x="12" y="16.5" fill="#143f45" font-family="Noto Sans, sans-serif" font-size="4.2" font-weight="700" letter-spacing="0.35">Field Notes</text>
    <path d="M 12,22 H 136" fill="none" stroke="#143f45" stroke-width="0.3"/>
  </g>
  <text id="headline" fill="#143f45" font-family="Noto Serif, serif" font-size="8.7" font-weight="400"><tspan x="12" y="40">Look once.</tspan> <tspan x="12" y="51.8">Look again.</tspan></text>
  <g id="original-contours" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path id="contour-1" d="M 88,31 C 102,27 122,29 130,35 C 139,42 128,47 124,51 C 120,56 124,62 135,65" stroke="#143f45" stroke-width="0.55"/>
    <path id="contour-2" d="M 86,35 C 99,30 118,32 123,37 C 130,43 119,47 116,52 C 112,59 120,66 132,69" stroke="#cd5935" stroke-width="1.2"/>
    <path id="contour-3" d="M 85,39 C 96,35 111,35 115,40 C 120,46 111,48 109,53 C 105,61 114,68 126,72" stroke="#143f45" stroke-width="0.45"/>
    <path id="contour-4" d="M 85,43 C 94,40 104,40 107,43 C 110,47 102,51 101,55 C 101,63 109,69 119,73" stroke="#b6be4e" stroke-width="1.5"/>
    <path id="contour-5" d="M 86,47 C 92,44 99,44 100,47 C 100,50 94,53 95,57 C 97,64 103,68 110,71" stroke="#143f45" stroke-width="0.45"/>
    <path id="contour-6" d="M 87,51 C 91,49 93,49 93,51 C 93,53 89,55 90,58 C 92,63 96,66 101,68" stroke="#143f45" stroke-width="0.45"/>
  </g>
  <g id="observation-1">
    <text x="12" y="86" fill="#143f45" font-family="Noto Sans, sans-serif" font-size="4.05" font-weight="500">Trace a boundary.</text>
    <g id="writing-rules-1" fill="none" stroke="#9dafa9" stroke-width="0.18">
      <path d="M 12,96 H 136"/>
      <path d="M 12,104 H 136"/>
      <path d="M 12,112 H 136"/>
    </g>
  </g>
  <g id="observation-2">
    <text x="12" y="126" fill="#143f45" font-family="Noto Sans, sans-serif" font-size="4.05" font-weight="500">Find the rhythm.</text>
    <g id="writing-rules-2" fill="none" stroke="#9dafa9" stroke-width="0.18">
      <path d="M 12,136 H 136"/>
      <path d="M 12,144 H 136"/>
      <path d="M 12,152 H 136"/>
    </g>
  </g>
  <g id="observation-3">
    <text x="12" y="166" fill="#143f45" font-family="Noto Sans, sans-serif" font-size="4.05" font-weight="500">Name what changed when you looked longer.</text>
    <g id="writing-rules-3" fill="none" stroke="#9dafa9" stroke-width="0.18">
      <path d="M 12,176 H 136"/>
      <path d="M 12,184 H 136"/>
      <path d="M 12,192 H 136"/>
    </g>
  </g>
  <text id="footer" x="12" y="202" fill="#143f45" font-family="Noto Sans, sans-serif" font-size="3.6" font-weight="400">Independent practice sheet.</text>
</svg>

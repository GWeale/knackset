<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Bryce Canyon counts under two methods</title><desc>Three NPS figures. The 2025 former-method figure is stated by the park, not an independent audit.</desc><rect width="960" height="540" fill="#f4efe5"/><text x="40" y="65" font-family="DejaVu Sans" font-size="33" fill="#152a23">Count the same thing before telling the story.</text><text x="40" y="105" font-family="DejaVu Sans" font-size="22" fill="#152a23">Bryce Canyon recreation visits / National Park Service figures</text><text x="40" y="194" font-family="DejaVu Sans" font-size="18" fill="#152a23">2024 reported</text><rect x="380" y="170" width="349.7305" height="35" fill="#60726a"/><text x="750" y="194" font-family="DejaVu Sans" font-size="22" fill="#152a23">2,498,075</text><text x="40" y="270" font-family="DejaVu Sans" font-size="18" fill="#152a23">2025 former-method figure*</text><rect x="380" y="246" width="341.2445" height="35" fill="#224e3f"/><text x="750" y="270" font-family="DejaVu Sans" font-size="22" fill="#152a23">2,437,461</text><text x="40" y="346" font-family="DejaVu Sans" font-size="18" fill="#152a23">2025 reported / new method</text><rect x="380" y="322" width="275.4314" height="35" fill="#c76535"/><text x="750" y="346" font-family="DejaVu Sans" font-size="22" fill="#152a23">1,967,367</text><text x="40" y="438" font-family="DejaVu Sans" font-size="25" fill="#152a23">Reported change: −21.2%  /  former-method figure: −2.4%</text><text x="40" y="478" font-family="DejaVu Sans" font-size="18" fill="#152a23">* NPS states what 2025 would have been under its earlier procedure.</text><text x="40" y="510" font-family="DejaVu Sans" font-size="16" fill="#152a23">Source: Bryce Canyon news release, 17 March 2026. Accessed 2 November 2026.</text><path d="M380 378H730M380 374V382M520 374V382M660 374V382" fill="none" stroke="#60726a"/><g fill="#152a23" font-family="DejaVu Sans" font-size="14"><text x="380" y="399" text-anchor="middle">0</text><text x="520" y="399" text-anchor="middle">1 million</text><text x="660" y="399" text-anchor="middle">2 million</text></g></svg>
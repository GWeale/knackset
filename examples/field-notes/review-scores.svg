<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Single-judge scores for six matched pairs</title><rect width="960" height="540" fill="#f4efe5"/><text x="40" y="54" text-anchor="start" font-family="DejaVu Sans" font-size="30" fill="#152a23">Small, task-specific differences in this round</text><text x="40" y="90" text-anchor="start" font-family="DejaVu Sans" font-size="20" fill="#152a23">One judge / two repeats per case / all twelve outputs usable</text><path d="M290 128V423" stroke="#c9cfc7"/><text x="290" y="450" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#152a23">0</text><path d="M410 128V423" stroke="#c9cfc7"/><text x="410" y="450" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#152a23">3</text><path d="M530 128V423" stroke="#c9cfc7"/><text x="530" y="450" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#152a23">6</text><path d="M650 128V423" stroke="#c9cfc7"/><text x="650" y="450" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#152a23">9</text><path d="M770 128V423" stroke="#c9cfc7"/><text x="770" y="450" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#152a23">12</text><text x="40" y="161" text-anchor="start" font-family="DejaVu Sans" font-size="18" fill="#152a23">Table proof 1</text><path d="M730 155H770" stroke="#60726a" stroke-width="3"/><circle cx="730" cy="155" r="7" fill="#60726a"/><circle cx="770" cy="155" r="7" fill="#c76535"/><text x="40" y="209" text-anchor="start" font-family="DejaVu Sans" font-size="18" fill="#152a23">Park investigation 1</text><path d="M730 203H770" stroke="#60726a" stroke-width="3"/><circle cx="730" cy="203" r="7" fill="#60726a"/><circle cx="770" cy="203" r="7" fill="#c76535"/><text x="40" y="257" text-anchor="start" font-family="DejaVu Sans" font-size="18" fill="#152a23">Two-ink worksheet 1</text><path d="M730 251H770" stroke="#60726a" stroke-width="3"/><circle cx="730" cy="251" r="7" fill="#60726a"/><circle cx="770" cy="251" r="7" fill="#c76535"/><text x="40" y="305" text-anchor="start" font-family="DejaVu Sans" font-size="18" fill="#152a23">Table proof 2</text><path d="M730 299H770" stroke="#60726a" stroke-width="3"/><circle cx="730" cy="299" r="7" fill="#60726a"/><circle cx="770" cy="299" r="7" fill="#c76535"/><text x="40" y="353" text-anchor="start" font-family="DejaVu Sans" font-size="18" fill="#152a23">Two-ink worksheet 2</text><path d="M730 347H770" stroke="#60726a" stroke-width="3"/><circle cx="730" cy="347" r="7" fill="#60726a"/><circle cx="770" cy="347" r="7" fill="#c76535"/><text x="40" y="401" text-anchor="start" font-family="DejaVu Sans" font-size="18" fill="#152a23">Park investigation 2</text><path d="M730 395H770" stroke="#60726a" stroke-width="3"/><circle cx="730" cy="395" r="7" fill="#60726a"/><circle cx="770" cy="395" r="7" fill="#c76535"/><text x="40" y="490" text-anchor="start" font-family="DejaVu Sans" font-size="17" fill="#152a23">Score out of 12; ordinal rubric points, not a percentage gain.</text><circle cx="790" cy="170" r="6" fill="#60726a"/><text x="806" y="176" text-anchor="start" font-family="DejaVu Sans" font-size="15" fill="#152a23">Without method</text><circle cx="790" cy="205" r="6" fill="#c76535"/><text x="806" y="211" text-anchor="start" font-family="DejaVu Sans" font-size="15" fill="#152a23">With method</text><text x="40" y="521" text-anchor="start" font-family="DejaVu Sans" font-size="16" fill="#152a23">Descriptive review only. No general or causal performance claim.</text></svg>
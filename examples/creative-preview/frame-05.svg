<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#152a23"/><path d="M40 42H920" stroke="#d5e953" stroke-width="3"/><text x="40" y="112" fill="#f4efe5" font-family="DejaVu Sans" font-size="39">Finish one useful thing.</text><text x="50" y="200" fill="#f4efe5" font-family="DejaVu Sans" font-size="29">The demo packet exists, with an editable artifact,</text><text x="50" y="250" fill="#f4efe5" font-family="DejaVu Sans" font-size="29">a source trail and a bounded first task.</text><text x="50" y="340" fill="#f4efe5" font-family="DejaVu Sans" font-size="26">The pilot is three pairs on one project&#x27;s launch work.</text><text x="50" y="400" fill="#d5e953" font-family="DejaVu Sans" font-size="25">General benefit and outside-user feedback remain open.</text><text x="40" y="517" fill="#f4efe5" font-family="DejaVu Sans" font-size="16">KNACKSET / PREVIEW     5 / 6</text></svg>
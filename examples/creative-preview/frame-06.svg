<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#152a23"/><path d="M40 42H920" stroke="#d5e953" stroke-width="3"/><text x="40" y="112" fill="#f4efe5" font-family="DejaVu Sans" font-size="39">Bring it a real job.</text><text x="50" y="205" fill="#d5e953" font-family="DejaVu Sans" font-size="35">Try one method for twenty minutes.</text><text x="50" y="280" fill="#f4efe5" font-family="DejaVu Sans" font-size="29">Tell us what you kept, fixed or discarded.</text><text x="50" y="380" fill="#f4efe5" font-family="DejaVu Sans" font-size="31">github.com/GWeale/knackset</text><text x="50" y="438" fill="#f4efe5" font-family="DejaVu Sans" font-size="22">The field-test guide is linked from the README.</text><text x="40" y="517" fill="#f4efe5" font-family="DejaVu Sans" font-size="16">KNACKSET / PREVIEW     6 / 6</text></svg>
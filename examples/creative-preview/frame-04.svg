<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#152a23"/><path d="M40 42H920" stroke="#d5e953" stroke-width="3"/><text x="40" y="112" fill="#f4efe5" font-family="DejaVu Sans" font-size="39">Ask what the evidence measures.</text><text x="50" y="200" fill="#f4efe5" font-family="DejaVu Sans" font-size="31">Passing helper tests checks the tools.</text><text x="50" y="270" fill="#f4efe5" font-family="DejaVu Sans" font-size="31">An older mail study checks its own tasks.</text><text x="50" y="340" fill="#d5e953" font-family="DejaVu Sans" font-size="29">Creative usefulness needs creative-task evidence.</text><text x="50" y="425" fill="#f4efe5" font-family="DejaVu Sans" font-size="23">Read the investigation and its source trail.</text><text x="40" y="517" fill="#f4efe5" font-family="DejaVu Sans" font-size="16">KNACKSET / PREVIEW     4 / 6</text></svg>
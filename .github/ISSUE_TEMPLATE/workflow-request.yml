name: Propose a workflow
description: Suggest one distinct, reusable task with a clear finish condition.
title: '[Workflow] '
body:
  - type: markdown
    attributes:
      value: 'Only the first two fields are required. Do not include raw histories, credentials, private links, or personal screenshots.'
  - type: textarea
    id: outcome
    attributes:
      label: User request and observable outcome
      description: Give one realistic request and the resulting state or artifact that proves completion.
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Website, service, or tool context
      description: Where should the task run, and which agent or tools do you use?
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Existing skill gap
      description: If you have checked the catalog, which skill is closest and what is missing?
    validations:
      required: false
  - type: textarea
    id: sources
    attributes:
      label: Public primary sources and reuse rights
      description: If available, link official documentation or licensed material and note any reuse terms.
    validations:
      required: false
  - type: textarea
    id: fixture
    attributes:
      label: Synthetic success and failure example
      description: If useful, give made-up inputs, the expected result, and something that could go wrong.
    validations:
      required: false

name: Propose a workflow
description: Suggest one distinct, reusable task with a clear finish condition.
title: '[Workflow] '
body:
  - type: markdown
    attributes:
      value: 'Use synthetic examples and public sources. Do not include raw histories, credentials, private account links, or personal screenshots.'
  - type: textarea
    id: outcome
    attributes:
      label: User request and observable outcome
      description: Give one realistic request and the resulting state or artifact that proves completion.
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Website or service and required capabilities
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Existing skill gap
      description: Which existing skill is closest, and what non-obvious knowledge is missing?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Public primary sources and reuse rights
      description: Link official documentation or licensed material. Propose original instructions when rights are uncertain.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Synthetic success and failure example
      description: Include inputs, expected outcome, and a boundary that could cause incorrect work.
    validations:
      required: true

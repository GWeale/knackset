name: Bring an interesting job
description: Show the material, the hard decision, and a useful result.
title: '[Skill idea] '
body:
  - type: markdown
    attributes:
      value: 'Only the first two fields are required. Do not include raw histories, credentials, private links, or personal screenshots.'
  - type: textarea
    id: outcome
    attributes:
      label: What do you want to make or figure out?
      description: Give one realistic request and describe the result you would want to keep.
    validations:
      required: true
  - type: input
    id: material
    attributes:
      label: What makes it hard?
      description: What material would you bring, and which decision needs more than an obvious checklist?
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Is an existing skill close?
      description: If you have checked the catalog, which skill is closest and what is missing?
    validations:
      required: false
  - type: textarea
    id: sources
    attributes:
      label: Useful references
      description: Link a skill, method, example, or official documentation worth studying. Include reuse terms for anything you propose bundling.
    validations:
      required: false
  - type: textarea
    id: fixture
    attributes:
      label: Example with made-up data
      description: If useful, give made-up inputs, the expected result, and something that could go wrong.
    validations:
      required: false

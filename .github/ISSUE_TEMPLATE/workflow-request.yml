name: Propose a workflow
description: Suggest a task and describe how an agent should know it is finished.
title: '[Workflow] '
body:
  - type: markdown
    attributes:
      value: 'Only the first two fields are required. Do not include raw histories, credentials, private links, or personal screenshots.'
  - type: textarea
    id: outcome
    attributes:
      label: What should the agent do?
      description: Give one realistic request and describe what you would check to know it finished.
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Where should it work?
      description: Where should the task run, and which agent or tools do you use?
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Is an existing skill close?
      description: If you have checked the catalog, which skill is closest and what is missing?
    validations:
      required: false
  - type: textarea
    id: sources
    attributes:
      label: Useful documentation
      description: Link official documentation if you have it. For material you want to reuse, include its license or reuse terms.
    validations:
      required: false
  - type: textarea
    id: fixture
    attributes:
      label: Example with made-up data
      description: If useful, give made-up inputs, the expected result, and something that could go wrong.
    validations:
      required: false

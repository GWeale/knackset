name: Report a workflow failure
description: Show what went wrong with a skill, package, or helper using made-up data.
title: '[Failure] '
body:
  - type: markdown
    attributes:
      value: 'Describe the failure with made-up data. Keep private histories, credentials, private links, and personal screenshots out of this report. For sensitive concerns, follow the [security guidance](https://github.com/GWeale/knackset/blob/main/SECURITY.md).'
  - type: input
    id: task
    attributes:
      label: Skill or task
      description: Name the skill or describe what you asked the agent to do.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What did you expect, and what happened?
      description: Include any errors and say whether you checked the saved result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Agent, tools, and versions
      description: If known, include the agent, tool versions, and skill commit or release. Leave out account identifiers and profile paths.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce with made-up data
      description: If possible, give made-up inputs and the smallest steps that reproduce the failure.
    validations:
      required: false
  - type: textarea
    id: limitations
    attributes:
      label: Anything else that would help?
      description: For example, a possible cause, a suggested fix, or a result you could not check.
    validations:
      required: false

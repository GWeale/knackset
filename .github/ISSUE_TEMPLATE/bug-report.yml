name: Report a workflow failure
description: Report an observed skill, packaging, or helper failure using sanitized evidence.
title: '[Failure] '
body:
  - type: markdown
    attributes:
      value: 'Describe the failure without raw histories, credentials, private links, or personal screenshots. For secret exposures, use private reporting in the repository Security tab when available.'
  - type: input
    id: task
    attributes:
      label: Skill or task
      description: Name the skill or describe what you asked the agent to do.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Expected versus observed result
      description: What should have happened, and what happened instead? Mention whether you checked the saved result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Agent, tools, and versions
      description: Helpful if known. Include the agent/tool versions and skill commit or release; omit account identifiers and profile paths.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic task and steps
      description: If possible, give made-up inputs and the smallest steps that reproduce the failure.
    validations:
      required: false
  - type: textarea
    id: limitations
    attributes:
      label: Missing evidence and suggested correction
    validations:
      required: false
